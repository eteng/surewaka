# Fly.io configuration for SureWaka API
# Region: London (lhr) — co-located with Neon Postgres (aws-eu-west-2)
# Latency: ~80ms to Lagos via submarine cables (WACS, MainOne, ACE)

app = "surewaka-api"
primary_region = "lhr"

[build]
  dockerfile = "../../infra/docker/Dockerfile.api"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
