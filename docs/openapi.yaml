# ── Components ───────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk JWT
      description: |
        Clerk-issued JWT. Obtain via @clerk/expo (mobile) or @clerk/react-router (web).
        Include as: Authorization: Bearer <token>

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Success:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    # ── Envelopes ────────────────────────────────────────────────────────────
    Envelope:
      type: object
      description: Standard success envelope
      properties:
        data: {}
        error: { nullable: true, example: null }
        meta:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/PaginationMeta'

    ErrorEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { nullable: true, example: null }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
        meta: { nullable: true, example: null }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    # ── Shared enums ─────────────────────────────────────────────────────────
    RoleEnum:
      type: string
      enum: [customer, driver, surewaka_admin, carrier_driver, carrier_admin, support_agent]

    VehicleTypeEnum:
      type: string
      enum: [motorcycle, car, van, truck]

    DeliveryStatusEnum:
      type: string
      enum:
        - pending_routing
        - routing_failed
        - draft
        - pending
        - accepted
        - en_route_pickup
        - arrived_pickup
        - picked_up
        - en_route_dropoff
        - arrived_dropoff
        - delivered
        - cancelled
        - failed
        - returned

    NotificationTypeEnum:
      type: string
      enum:
        - new_user_signup
        - delivery_issue
        - carrier_verification_request
        - carrier_verified
        - dispute_opened
        - driver_verification_request
        - system_alert

    # ── Domain objects ────────────────────────────────────────────────────────
    Location:
      type: object
      required: [address, city, state, lat, lng]
      properties:
        address: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        gender:
          type: string
          enum: [woman, man, prefer_not_to_disclose]
          nullable: true
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Delivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DeliveryStatusEnum' }
        mode: { type: string, enum: [on_demand, carrier_direct, surewaka_way] }
        pickup: { $ref: '#/components/schemas/Location' }
        dropoff: { $ref: '#/components/schemas/Location' }
        packageDetails:
          type: object
          properties:
            description: { type: string }
            weight: { type: number }
            category: { type: string }
        recipientDetails:
          type: object
          properties:
            recipientName: { type: string }
            recipientPhone: { type: string }
            deliveryNotes: { type: string, nullable: true }
        totalPriceKobo: { type: integer }
        paymentStatus: { type: string, enum: [unpaid, escrowed, released, refunded] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationTypeEnum' }
        title: { type: string }
        message: { type: string }
        resourceLink: { type: string, nullable: true }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    QuoteResponse:
      type: object
      properties:
        legs:
          type: array
          items:
            type: object
            properties:
              legType: { type: string }
              lineItems:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    amountKobo: { type: integer }
              totalKobo: { type: integer }
        compositeTotalKobo: { type: integer }

    # ── Request schemas ───────────────────────────────────────────────────────
    RegisterUserRequest:
      type: object
      required: [email, phone, name, role]
      properties:
        email: { type: string, format: email }
        phone: { type: string, description: "Nigerian mobile number (+234XXXXXXXXXX or 0XXXXXXXXXX)" }
        name: { type: string, minLength: 2, maxLength: 100 }
        role: { type: string, enum: [customer, driver, carrier] }

    CreateSavedAddressRequest:
      type: object
      required: [label, address_text, city, state, lat, lng]
      properties:
        label: { type: string, minLength: 1, maxLength: 50 }
        address_text: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number }
        lng: { type: number }

    UpsertRecentLocationRequest:
      type: object
      required: [address_text, city, state, lat, lng]
      properties:
        address_text: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number }
        lng: { type: number }

    CreateDeliveryRequest:
      type: object
      required: [pickup, dropoff, packageDetails, recipientDetails]
      properties:
        pickup: { $ref: '#/components/schemas/Location' }
        dropoff: { $ref: '#/components/schemas/Location' }
        packageDetails:
          type: object
          required: [description, weight, category]
          properties:
            description: { type: string, minLength: 3, maxLength: 500 }
            weight: { type: number, minimum: 0, maximum: 500, description: Weight in kg }
            category:
              type: string
              enum: [documents, electronics, clothing, food, fragile, general, furniture, auto_parts]
        recipientDetails:
          type: object
          required: [recipientName, recipientPhone]
          properties:
            recipientName: { type: string, minLength: 2, maxLength: 100 }
            recipientPhone: { type: string }
            deliveryNotes: { type: string, maxLength: 200 }
        mode: { type: string, enum: [on_demand, carrier_direct, surewaka_way] }

    QuoteRequest:
      type: object
      required: [legs, packageWeight]
      properties:
        legs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            oneOf:
              - type: object
                required: [legType, vehicleType, pickup, dropoff]
                properties:
                  legType: { type: string, enum: [first_mile, last_mile] }
                  vehicleType: { $ref: '#/components/schemas/VehicleTypeEnum' }
                  pickup:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                  dropoff:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
              - type: object
                required: [legType, carrierId]
                properties:
                  legType: { type: string, enum: [intercity] }
                  carrierId: { type: string, format: uuid }
                  routeId: { type: string, format: uuid }
        packageWeight: { type: number, minimum: 0, maximum: 500, description: Weight in kg }

    PayoutRequest:
      type: object
      required: [amount, bank_code, account_number, account_name]
      properties:
        amount: { type: integer, minimum: 100000, description: "Kobo (min ₦1,000)" }
        bank_code: { type: string, minLength: 3, maxLength: 10 }
        account_number: { type: string, pattern: '^\d{10}$' }
        account_name: { type: string, minLength: 2, maxLength: 100 }

    CreateNotificationRequest:
      type: object
      required: [userId, type, title, message]
      properties:
        userId:
          description: UUID or "all_admins" to broadcast
          oneOf:
            - { type: string, format: uuid }
            - { type: string, enum: [all_admins] }
        type: { $ref: '#/components/schemas/NotificationTypeEnum' }
        title: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 500 }
        resourceLink: { type: string, description: "Relative URL (must start with /)" }

    InviteEmployeeRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, minLength: 2, maxLength: 100 }
        role: { $ref: '#/components/schemas/RoleEnum' }
        scopeType: { type: string, enum: [carrier] }
        scopeId: { type: string, format: uuid }

    UpdateEmployeeRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/RoleEnum' }

    AssignRoleRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/RoleEnum' }
        scopeType: { type: string, enum: [carrier] }
        scopeId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }

    RevokeRoleRequest:
      type: object
      required: [userId, role, reason]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/RoleEnum' }
        scopeId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }

    SubmitCarrierApplicationRequest:
      type: object
      required: [businessName, contactName, email, phone, serviceAreas]
      properties:
        businessName: { type: string, minLength: 2, maxLength: 200 }
        contactName: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, description: "+234XXXXXXXXXX" }
        cacNumber: { type: string, maxLength: 20 }
        fleetSize: { type: integer, minimum: 1 }
        serviceAreas: { type: array, items: { type: string }, minItems: 1 }
        notes: { type: string, maxLength: 1000 }

    ApproveCarrierApplicationRequest:
      type: object
      required: [carrierName, slug]
      properties:
        carrierName: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        driverVettingEnabled: { type: boolean, default: false }
        adminPhone: { type: string }
        adminEmail: { type: string, format: email }
        notes: { type: string, maxLength: 500 }

    CreateStrategicCarrierRequest:
      type: object
      required: [carrierName, slug, contactName]
      properties:
        carrierName: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        contactName: { type: string, minLength: 2, maxLength: 100 }
        adminPhone: { type: string }
        adminEmail: { type: string, format: email }
        driverVettingEnabled: { type: boolean, default: false }

    CreateCarrierParkRequest:
      type: object
      required: [carrierId, city, name, address, lat, lng]
      properties:
        carrierId: { type: string, format: uuid }
        city: { type: string, minLength: 2, maxLength: 100 }
        name: { type: string, minLength: 2, maxLength: 200 }
        address: { type: string, minLength: 5, maxLength: 500 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    UpdateCarrierParkRequest:
      type: object
      properties:
        carrierId: { type: string, format: uuid }
        city: { type: string }
        name: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        isActive: { type: boolean }

    CreateCarrierRouteRequest:
      type: object
      required: [carrierId, originParkId, destinationParkId, basePriceKobo, estimatedTransitHrs]
      properties:
        carrierId: { type: string, format: uuid }
        originParkId: { type: string, format: uuid }
        destinationParkId: { type: string, format: uuid }
        basePriceKobo: { type: integer, minimum: 1 }
        estimatedTransitHrs: { type: number, minimum: 0 }
        maxWeightKg: { type: number, minimum: 0 }

    UpdateCarrierRouteRequest:
      type: object
      properties:
        basePriceKobo: { type: integer, minimum: 1 }
        estimatedTransitHrs: { type: number, minimum: 0 }
        maxWeightKg: { type: number, minimum: 0 }
        isActive: { type: boolean }

    CreateCarrierRouteScheduleRequest:
      type: object
      required: [hour]
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59, default: 0 }
        daysOfWeek:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "1=Mon … 7=Sun"

    UpdateCarrierRouteScheduleRequest:
      type: object
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        daysOfWeek:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        isActive: { type: boolean }

    BroadcastRequest:
      type: object
      required: [title, body, segment]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 1, maxLength: 500 }
        segment: { type: string, enum: [all, customers, drivers] }
        city: { type: string }
        deepLink: { type: string, format: uri }

    CreateZoneRequest:
      type: object
      required: [name, city, country, keywords]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        country: { type: string, minLength: 1, maxLength: 100 }
        keywords: { type: array, items: { type: string }, minItems: 1, maxItems: 50 }
        swLat: { type: number, nullable: true }
        swLng: { type: number, nullable: true }
        neLat: { type: number, nullable: true }
        neLng: { type: number, nullable: true }
        isActive: { type: boolean, default: true }

    UpdateZoneRequest:
      type: object
      description: All fields optional for PATCH
      properties:
        name: { type: string }
        city: { type: string }
        country: { type: string }
        keywords: { type: array, items: { type: string } }
        swLat: { type: number, nullable: true }
        swLng: { type: number, nullable: true }
        neLat: { type: number, nullable: true }
        neLng: { type: number, nullable: true }
        isActive: { type: boolean }

    UpdateFeeSettingsRequest:
      type: object
      properties:
        baseRateKobo: { type: integer, minimum: 0 }
        perKgRateKobo: { type: integer, minimum: 0 }
        perKmRateKobo: { type: integer, minimum: 0 }
        carrierCommissionRatePct: { type: number, minimum: 0, maximum: 100 }
        taxRatePct: { type: number, minimum: 0, maximum: 100 }
        minPriceKobo: { type: integer, minimum: 0 }
        withdrawalFeeKobo: { type: integer, minimum: 0 }
        weightCorrectionApprovalWindowMin: { type: integer, minimum: 1, maximum: 60 }

    UpdateAlertSettingsRequest:
      type: object
      properties:
        driverSilentWarningMin: { type: integer, minimum: 5, maximum: 60 }
        driverSilentCriticalMin: { type: integer, minimum: 10, maximum: 120 }
        legOverdueWarningMin: { type: integer, minimum: 10, maximum: 120 }
        legOverdueCriticalMin: { type: integer, minimum: 20, maximum: 240 }
        customerUpdateGapWarningMin: { type: integer, minimum: 15, maximum: 120 }
        customerUpdateGapCriticalMin: { type: integer, minimum: 30, maximum: 240 }
        ontimeRateWarningPct: { type: integer, minimum: 50, maximum: 100 }
        ontimeRateCriticalPct: { type: integer, minimum: 30, maximum: 90 }
        pumbleWebhookUrl: { type: string, format: uri, nullable: true }
        pushEnabled: { type: boolean }
        pumbleEnabled: { type: boolean }
