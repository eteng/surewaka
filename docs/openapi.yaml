openapi: 3.0.3
info:
  title: SureWaka API
  description: |
    SureWaka logistics platform API. Connects senders with verified logistics providers
    and independent drivers across Nigeria using a multi-leg delivery model.

    **Auth:** All endpoints require a Clerk JWT Bearer token unless marked `security: []`.

    **Response envelope:** Every response is `{ data, error, meta }` where exactly one of
    data/error is non-null. meta carries pagination when applicable.

    **Currency:** All monetary values are in kobo (1 NGN = 100 kobo).
  version: "1.0.0"
servers:
  - url: https://api.surewaka.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Development

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Profile
  - name: Addresses
  - name: Deliveries
  - name: Booking
  - name: Wallet
  - name: Payouts
  - name: Notifications
  - name: Push Tokens
  - name: Carriers
  - name: Carrier Routes
  - name: Carrier Applications
  - name: Driver Location
  - name: Driver Matching
    description: Real-time driver matching and delivery acceptance (tiered broadcast, first-accept-wins)
  - name: Delivery Legs
    description: Multi-leg delivery status management and event-driven dispatch
  - name: Zones
  - name: Webhooks
  - name: Admin — Users
  - name: Admin — Roles
  - name: Admin — Dashboard
  - name: Admin — Carriers
  - name: Admin — Carrier Parks
  - name: Admin — Carrier Routes
  - name: Admin — Customers
  - name: Admin — Drivers
  - name: Admin — Deliveries
  - name: Admin — Waitlist
  - name: Admin — Name Change Requests
  - name: Admin — Ops Hub
  - name: Admin — Alerts
  - name: Admin — Alert Settings
  - name: Admin — Fee Settings
  - name: Admin — Analytics
  - name: Admin — Finance
  - name: Admin — Payouts
  - name: Admin — Broadcast
  - name: Admin — Zones

paths:

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/register-employee:
    post:
      tags: [Auth]
      summary: Register an invited employee (called after Clerk sign-up)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clerkId, clerkEmail, clerkName]
              properties:
                clerkId: { type: string }
                clerkPhone: { type: string }
                clerkEmail: { type: string, format: email }
                clerkName: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ── Profile ───────────────────────────────────────────────────────────────
  /profile:
    get:
      tags: [Profile]
      summary: Get authenticated user's profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Update authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                gender:
                  type: string
                  enum: [woman, man, prefer_not_to_disclose]
                  nullable: true
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /profile/avatar:
    post:
      tags: [Profile]
      summary: Upload profile avatar (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Profile]
      summary: Remove profile avatar
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /profile/name-change-request:
    post:
      tags: [Profile]
      summary: Submit a name change request for admin review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedName, reason]
              properties:
                requestedName: { type: string, minLength: 2, maxLength: 100 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Success' }

  # ── Addresses ─────────────────────────────────────────────────────────────
  /addresses:
    get:
      tags: [Addresses]
      summary: List saved addresses
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Addresses]
      summary: Create a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedAddressRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /addresses/recent:
    get:
      tags: [Addresses]
      summary: List recent locations
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Addresses]
      summary: Upsert a recent location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertRecentLocationRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Addresses]
      summary: Get a saved address
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Addresses]
      summary: Replace a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedAddressRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Addresses]
      summary: Delete a saved address
      responses:
        '200': { $ref: '#/components/responses/Success' }

  # ── Deliveries ────────────────────────────────────────────────────────────
  /deliveries:
    get:
      tags: [Deliveries]
      summary: List deliveries for authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated deliveries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Delivery' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Deliveries]
      summary: Create a new delivery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliveryRequest' }
      responses:
        '201':
          description: Delivery created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Delivery' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /deliveries/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deliveries]
      summary: Get delivery details
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deliveries/{id}/requote:
    post:
      tags: [Deliveries]
      summary: Re-quote a delivery (surewaka_way only; price may change)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /deliveries/{id}/weight-correction/{correctionId}/respond:
    post:
      tags: [Deliveries]
      summary: Customer approves or declines a weight correction
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: correctionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, declined] }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  # ── Booking ───────────────────────────────────────────────────────────────
  /booking/quote:
    post:
      tags: [Booking]
      summary: Get a price quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Price quote
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuoteResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /booking/confirm:
    post:
      tags: [Booking]
      summary: Confirm booking and deduct from wallet (escrow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_id]
              properties:
                delivery_id: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '402':
          description: Insufficient wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /deliveries/{id}/cancel:
    post:
      tags: [Booking]
      summary: Cancel a delivery
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 5, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422':
          description: Cannot cancel (already delivered or in terminal state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ── Wallet ────────────────────────────────────────────────────────────────
  /wallet/balance:
    get:
      tags: [Wallet]
      summary: Get wallet balance
      responses:
        '200':
          description: Wallet balance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          balance_kobo: { type: integer }
                          escrow_kobo: { type: integer }
                          available_kobo: { type: integer }

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: List wallet transactions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /wallet/dva:
    get:
      tags: [Wallet]
      summary: Get dedicated virtual account (Paystack DVA)
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /wallet/fund:
    post:
      tags: [Wallet]
      summary: Initialize a wallet top-up via Paystack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  description: Amount in kobo (min 50000 = ₦500)
                  minimum: 50000
                topup_type:
                  type: string
                  enum: [manual, booking_shortfall]
                  default: manual
                delivery_id: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /wallet/fund/{reference}:
    get:
      tags: [Wallet]
      summary: Verify a top-up by Paystack reference
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /wallet/check:
    post:
      tags: [Wallet]
      summary: Check if wallet has sufficient balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, description: Amount in kobo }
      responses:
        '200':
          description: Balance check result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sufficient: { type: boolean }
                          balance_kobo: { type: integer }
                          shortfall_kobo: { type: integer }

  # ── Payouts ───────────────────────────────────────────────────────────────
  /payouts:
    get:
      tags: [Payouts]
      summary: List payout requests for authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /payouts/request:
    post:
      tags: [Payouts]
      summary: Request a payout (driver / carrier)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ── Push Tokens ───────────────────────────────────────────────────────────
  /push-tokens:
    post:
      tags: [Push Tokens]
      summary: Register an Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expoPushToken, deviceId, platform, app]
              properties:
                expoPushToken:
                  type: string
                  description: Must start with ExponentPushToken[
                deviceId: { type: string }
                platform: { type: string, enum: [ios, android] }
                app: { type: string, enum: [customer, driver] }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /push-tokens/{token}:
    delete:
      tags: [Push Tokens]
      summary: Unregister a push token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  # ── Carriers (public) ─────────────────────────────────────────────────────
  /carriers:
    get:
      tags: [Carriers]
      summary: List active carriers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  # ── Carrier Routes (public) ───────────────────────────────────────────────
  /carrier-routes:
    get:
      tags: [Carrier Routes]
      summary: List active carrier routes
      parameters:
        - name: carrierId
          in: query
          schema: { type: string, format: uuid }
        - name: originCity
          in: query
          schema: { type: string }
        - name: destinationCity
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  # ── Carrier Applications ──────────────────────────────────────────────────
  /carrier-applications:
    post:
      tags: [Carrier Applications]
      summary: Submit a carrier application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitCarrierApplicationRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ── Driver Location ───────────────────────────────────────────────────────
  /driver/location:
    post:
      tags: [Driver Location]
      summary: Update driver GPS position (real-time matching)
      description: |
        Stores the driver's position in Redis (geo set + metadata hash) for real-time
        spatial queries, publishes to Ably for live tracking, and optionally persists
        to Postgres when an active delivery is in progress.

        Rate-limited to 1 request per 2 seconds per driver.
        Requires `driver` or `carrier_driver` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                deliveryId:
                  type: string
                  format: uuid
                  description: If provided, location is also persisted to the audit trail
      responses:
        '200':
          description: Location recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          recorded: { type: boolean }
                          id: { type: string, format: uuid, description: Postgres record ID (only when deliveryId provided) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: Driver role required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Rate limited (max 1 request per 2 seconds per driver)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ── Delivery Acceptance (Driver Matching) ─────────────────────────────────
  /deliveries/{deliveryId}/accept:
    post:
      tags: [Driver Matching]
      summary: Accept a delivery offer (first-accept-wins)
      description: |
        Driver taps "Accept" on a delivery offer. Uses atomic Redis SET NX to ensure
        exactly one driver is assigned even when multiple drivers tap simultaneously.

        On success: delivery is assigned to this driver, all other pending offers are
        cancelled, reservations are released, and a `driver-assigned` event is published.

        On failure (another driver already claimed): returns `matched: false` with no
        state mutations.

        Requires `driver` or `carrier_driver` role. The driver must have a pending
        `delivery_offers` record for this delivery.
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Claim result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [matched]
                        properties:
                          matched:
                            type: boolean
                            description: |
                              `true` — driver successfully assigned to the delivery.
                              `false` — another driver already claimed (race lost) or duplicate request.
        '400':
          description: Invalid delivery ID format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Driver role required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: No pending offer found for this driver/delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ── Delivery Legs (Status Update) ────────────────────────────────────────
  /deliveries/{deliveryId}/legs/{legId}/status:
    patch:
      tags: [Delivery Legs]
      summary: Update a delivery leg status
      description: |
        Updates the status of a delivery leg. When a leg is marked `delivered`,
        automatically triggers driver matching for the next driver-type leg in
        sequence (event-driven multi-leg dispatch per ADR-010).
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: legId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, accepted, en_route_pickup, arrived_pickup, picked_up, en_route_dropoff, arrived_dropoff, delivered, cancelled, failed]
      responses:
        '200':
          description: Leg updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Zones (public) ────────────────────────────────────────────────────────
  /zones:
    get:
      tags: [Zones]
      summary: List service zones
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }

  # ── Notifications ─────────────────────────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema: { type: string }
        - name: isRead
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Notifications]
      summary: Create a notification (admin use)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotificationRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer }

  /notifications/mark-all-read:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        '200':
          description: Count of notifications updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated: { type: integer }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Webhooks ──────────────────────────────────────────────────────────────
  /webhook/paystack:
    post:
      tags: [Webhooks]
      summary: Paystack payment webhook
      security: []
      description: Validated via x-paystack-signature header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string }
                data: { type: object }
      responses:
        '200': { description: Webhook processed }

  # ── Admin — Dashboard ─────────────────────────────────────────────────────
  /admin/dashboard/stats:
    get:
      tags: [Admin — Dashboard]
      summary: Platform overview statistics
      responses:
        '200': { $ref: '#/components/responses/Success' }

  # ── Admin — Users ─────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin — Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/RoleEnum' }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
